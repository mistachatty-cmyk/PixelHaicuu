<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f6fcf">
<meta name="robots" content="noindex">
<title>Kujo-sama · The HaiCuu Experience</title>
<meta name="description" content="Kujo-sama, the Dalai Llama - an interactive pixel world for The HaiCuu Experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff8fc4; --hot:#ff2ea6; --ink:#4a1f46; --paper:#fff4fa; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#bddff9; overscroll-behavior:none; }
  body { font-family:'Press Start 2P', ui-monospace, monospace; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; left:50%; top:0; transform:translateX(-50%); image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; cursor:default; }
  .ov { position:fixed; left:0; right:0; pointer-events:none; text-align:center; }

  /* LLAMASTE greeting */
  #hello { top:50%; transform:translateY(-50%) scale(0); opacity:0; font-size:clamp(20px,7.2vw,60px); line-height:1.25; color:#fff;
    text-shadow: 0 4px 0 var(--hot), 4px 0 0 var(--hot), -4px 0 0 var(--hot), 0 -4px 0 var(--hot), 4px 4px 0 #b0126f, -4px 4px 0 #b0126f, 0 8px 0 #7a0a4c;
    letter-spacing:.04em; }
  #hello small { display:block; margin-top:22px; font-size:clamp(7px,1.6vw,12px); color:var(--paper); text-shadow:2px 2px 0 var(--ink); letter-spacing:.2em; }
  #hello.show { opacity:1; transform:translateY(-50%) scale(1); transition:transform .55s cubic-bezier(.2,1.7,.4,1), opacity .2s; }
  #hello.slide { opacity:0; transform:translateY(-190%) scale(.92); transition:transform .75s cubic-bezier(.5,0,.8,.4), opacity .7s ease-in; }
  #hello.gone { transition:none; }

  /* haiku */
  #haiku { top:13vh; padding:0 6vw; font-size:clamp(9px,2.5vw,16px); line-height:2.1; color:#fff; text-shadow:2px 2px 0 var(--ink), 0 0 12px rgba(255,255,255,.4); opacity:0; transition:opacity .4s; }
  #haiku.on { opacity:1; }
  .w { display:inline-block; opacity:0; transform:translateY(10px) scale(.7); transition:opacity .28s, transform .38s cubic-bezier(.2,1.6,.4,1); }
  .w.in { opacity:1; transform:none; }
  .w.out { opacity:0; transform:translateY(-12px) scale(.9); transition:opacity .3s, transform .3s; }

  /* HUD */
  #brand { top:calc(12px + env(safe-area-inset-top)); left:14px; right:auto; text-align:left; font-size:7px; line-height:1.9; color:#fff; text-shadow:1px 1px 0 var(--ink); opacity:0; transition:opacity 1s; }
  #credit { position:fixed; left:0; right:0; bottom:calc(5px + env(safe-area-inset-bottom)); z-index:0; text-align:center; font-size:6px; letter-spacing:.06em; color:#fff; opacity:.38; pointer-events:none; text-shadow:1px 1px 0 var(--ink); white-space:nowrap; }
  #brand b { color:#ffe566; font-weight:normal; }
  #hud { bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; transform:translateY(14px); transition:opacity .8s, transform .8s; }
  #hud.on { opacity:1; transform:none; }
  .row { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; pointer-events:none; }
  button { pointer-events:auto; font:inherit; font-size:9px; color:var(--ink); background:var(--paper); border:0; padding:11px 12px; min-height:40px; min-width:40px; cursor:pointer;
    box-shadow: 0 -3px 0 0 var(--pink) inset, 3px 0 0 0 var(--ink), -3px 0 0 0 var(--ink), 0 3px 0 0 var(--ink), 0 -3px 0 0 var(--ink); }
  button:active { transform:translateY(2px); }
  button[aria-pressed="true"] { background:#ffe566; }
  button:focus-visible { outline:3px solid var(--hot); outline-offset:3px; }
  #look { min-width:130px; font-size:8px; }
  #track { font-size:7px; color:#fff; text-shadow:1px 1px 0 var(--ink); min-height:10px; }
  #scrollbtn { position:fixed; right:12px; top:50%; transform:translateY(-50%); pointer-events:auto; opacity:0; transition:opacity .8s; }
  #scrollbtn.on { opacity:1; animation:nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform:translateY(calc(-50% + 4px)); } }
  #skip { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); font-size:7px; opacity:.85; }
  #skip.gone { display:none; }
  #noscript { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px; font-size:12px; line-height:2; }


  /* Track sheet (Pixel Q Music + MP3s) */
  #tracks { position:fixed; inset:0; z-index:15; display:flex; align-items:flex-end; justify-content:center; background:rgba(74,31,70,0); transition:background .3s; padding:0 10px max(10px,env(safe-area-inset-bottom)); }
  #tracks[hidden] { display:none; }
  #tracks.open { background:rgba(74,31,70,.45); }
  .sheet { width:min(560px,100%); max-height:78vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); transform:translateY(110%); transition:transform .38s cubic-bezier(.2,1.25,.4,1);
    box-shadow:0 0 0 4px var(--ink), 0 0 0 8px var(--pink), 0 0 0 12px var(--ink); margin-bottom:12px; }
  #tracks.open .sheet { transform:none; }
  .sheet header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--hot); color:#fff; box-shadow:0 4px 0 #b0126f; }
  .sheet header .ttl { flex:1; font-size:10px; line-height:1.7; text-shadow:2px 2px 0 var(--ink); }
  .sheet header .ttl small { display:block; font-size:7px; color:#ffe9f6; }
  #tlist { overflow:auto; padding:10px 12px 14px; overscroll-behavior:contain; }
  .grp { font-size:7px; letter-spacing:.12em; color:#b0126f; margin:12px 2px 8px; }
  .trk { display:flex; align-items:center; gap:10px; width:100%; text-align:left; margin:0 0 8px; padding:10px 12px; min-height:48px; background:#fff; font-size:8px; line-height:1.7; }
  .trk .n { color:#b0126f; width:16px; flex:none; }
  .trk .nm { flex:1; min-width:0; }
  .trk .nm small { display:block; font-size:6px; color:#8a5a86; }
  .trk .eq { display:none; gap:2px; align-items:flex-end; height:14px; }
  .trk .eq i { width:3px; background:var(--hot); height:4px; }
  .trk[aria-current="true"] { background:#ffe566; }
  .trk[aria-current="true"] .eq { display:flex; }
  .trk.live .eq i { animation:eq .5s ease-in-out infinite alternate; }
  .trk.live .eq i:nth-child(2) { animation-delay:.12s; } .trk.live .eq i:nth-child(3) { animation-delay:.24s; }
  @keyframes eq { to { height:14px; } }
  #tnote { font-size:7px; line-height:1.9; color:#8a5a86; padding:2px 4px 6px; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition:none; } .trk.live .eq i { animation:none; height:9px; } }
  /* Bible reader */
  #bible { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); background:rgba(42,20,32,0); transition:background .35s; perspective:1100px; }
  #bible[hidden] { display:none; }
  #bible.open { background:rgba(42,20,32,.62); }
  .book { width:min(640px,100%); max-height:100%; display:flex; flex-direction:column; background:#fff1d0; color:#3a2228; position:relative;
    box-shadow:0 0 0 4px #2a1420, 0 0 0 8px #8f2d52, 0 0 0 12px #2a1420, 12px 14px 0 12px rgba(0,0,0,.28);
    transform-origin:left center; transform:rotateY(-80deg) scale(.4); opacity:0; transition:transform .42s cubic-bezier(.2,1.25,.4,1), opacity .25s; }
  #bible.open .book { transform:none; opacity:1; }
  #bible.shut .book { transform:rotateY(-80deg) scale(.4); opacity:0; transition:transform .3s ease-in, opacity .3s; }
  .book header { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#8f2d52; color:#ffd24a; box-shadow:0 4px 0 #6b1f3a; }
  .book header .ttl { flex:1; font-size:10px; line-height:1.6; text-shadow:2px 2px 0 #2a1420; }
  .book header .ttl small { color:#ffe9b0; font-size:7px; display:block; }
  #bx { background:#fff1d0; }
  #bverse { padding:22px 18px 18px; overflow:auto; text-align:center; }
  #bcard { padding:20px 14px 16px; background:#fffaf0; box-shadow:0 0 0 3px #d99a1e inset, 0 0 0 5px #fffaf0 inset, 0 0 0 7px #d99a1e inset; }
  #bcard.flip { animation:flip .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes flip { 0% { transform:rotateX(80deg) scale(.9); opacity:0; } 100% { transform:none; opacity:1; } }
  #bvt { font:400 1em/1.65 Georgia,'Times New Roman',serif; font-size:clamp(17px,4.4vw,22px); margin:8px 6px 14px; }
  #bvr { font-size:9px; color:#8f2d52; line-height:1.8; margin:0; }
  .btnrow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  #bverse[hidden], #bchapview[hidden] { display:none; }
  #bchapview { display:flex; flex-direction:column; min-height:0; flex:1; }
  .nav { display:flex; gap:6px; padding:10px 12px; align-items:center; flex-wrap:wrap; background:#f3dcab; }
  .nav select { font:inherit; font-size:9px; min-height:40px; padding:6px 8px; color:#3a2228; background:#fff1d0; border:3px solid #2a1420; flex:1; min-width:0; max-width:240px; }
  .nav select#bchap { flex:0 0 auto; max-width:90px; }
  .nav .sp { flex:1; }
  .nav button:disabled { opacity:.35; cursor:default; }
  #btext { overflow:auto; padding:14px 16px 28px; font:400 17px/1.75 Georgia,'Times New Roman',serif; flex:1; min-height:0; -webkit-overflow-scrolling:touch; user-select:text; -webkit-user-select:text; overscroll-behavior:contain; }
  #btext.turn { animation:turn .3s ease-out; }
  @keyframes turn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
  #btext h2 { font:400 12px/1.7 'Press Start 2P',monospace; color:#8f2d52; margin:0 0 12px; text-align:center; }
  #btext .v { cursor:pointer; border-radius:2px; transition:background .2s; padding:1px 0; }
  #btext .v:hover { background:rgba(255,210,74,.28); }
  #btext .v.hl { background:#ffe36b; box-shadow:0 2px 0 #d99a1e; }
  #btext .v.pop { animation:vpop .35s cubic-bezier(.2,1.8,.4,1); }
  @keyframes vpop { 0% { transform:scale(.96); } 50% { transform:scale(1.03); } 100% { transform:none; } }
  #btext sup { font:400 7px 'Press Start 2P',monospace; color:#ff2ea6; margin-right:4px; vertical-align:super; }
  .tip { font-size:7px; color:#8f2d52; text-align:center; padding:6px 10px 10px; line-height:1.8; background:#f3dcab; }
  #bvtip { margin-top:14px; font-size:7px; color:#8f2d52; line-height:1.8; }
  #bible button { background:#fffaf0; }
  @media (prefers-reduced-motion: reduce) { .book, #bible.shut .book { transition:opacity .15s; transform:none; } #bcard.flip, #btext.turn { animation:none; } }
  button.pop { animation:bpop .28s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bpop { 0% { transform:scale(.88); } 60% { transform:scale(1.07); } 100% { transform:none; } }
  @media (hover:hover) { button:hover { transform:translateY(-1px); filter:brightness(1.06); } button:active { transform:translateY(2px); } }
  @media (prefers-reduced-motion: reduce) { #hello, #hello.show, #hello.slide, .w { transition-duration:.01s; } #scrollbtn.on { animation:none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Kujo-sama sitting under a cherry blossom tree. Tap him to change his look."></canvas>
<div id="hello" class="ov" role="status">LLAMASTÉ<small>PEACE · HELLO</small></div>
<div id="haiku" class="ov" aria-live="polite"></div>
<div id="credit">POWERED BY LOK SERVICES · DESIGNED BY G6 DESIGNS</div>
<div id="brand" class="ov"><b>LLAMASTÉ PRODUCTIONS</b><br>EST. 1998</div>
<button id="scrollbtn" aria-label="Scroll the world">▼</button>
<div id="hud" class="ov">
  <div id="track" aria-live="polite"></div>
  <div class="row">
    <button id="prev" aria-label="Previous look">◀</button>
    <button id="look" aria-label="Current look: tap to change">LOOK</button>
    <button id="next" aria-label="Next look">▶</button>
    <button id="auto" aria-label="Switch looks automatically" aria-pressed="false">AUTO</button>
  </div>
  <div class="row">
    <button id="play" aria-label="Play music" aria-pressed="false">♪ PLAY</button>
    <button id="songs" aria-label="Choose a song">♫ SONGS</button>
    <button id="mute" aria-label="Sound on/off" aria-pressed="false">SOUND</button>
    <button id="bibtn" aria-label="Open the Bible">✝ BIBLE</button>
  </div>
</div>
<div id="tracks" role="dialog" aria-modal="true" aria-label="Music" hidden>
  <div class="sheet">
    <header><div class="ttl">♫ MUSIC<small>PIXEL Q MUSIC · LLAMASTÉ PRODUCTIONS</small></div><button id="tprev" aria-label="Previous song">⏮</button><button id="tnext" aria-label="Next song">⏭</button><button id="tx" aria-label="Close music">✕</button></header>
    <div id="tlist"></div>
  </div>
</div>
<div id="bible" role="dialog" aria-modal="true" aria-label="Holy Bible reader" hidden>
  <div class="book">
    <header><div class="ttl">HOLY BIBLE<small>KING JAMES VERSION</small></div><button id="bx" aria-label="Close Bible">✕</button></header>
    <div id="bverse">
      <div id="bcard"><p id="bvt"></p><p id="bvr"></p></div>
      <div class="btnrow" id="bread-wrap"><button id="bnew">↻ NEW VERSE</button><button id="bread">READ CHAPTER</button><button id="bcopy">COPY</button></div>
      <p id="bvtip">OPEN READ CHAPTER TO BROWSE ANY BOOK</p>
    </div>
    <div id="bchapview" hidden>
      <div class="nav">
        <button id="bprev" aria-label="Previous chapter">◀</button>
        <select id="bbook" aria-label="Book"></select>
        <select id="bchap" aria-label="Chapter"></select>
        <button id="bnext" aria-label="Next chapter">▶</button>
        <button id="bmode" aria-label="Back to a verse">✦</button>
      </div>
      <div id="btext" tabindex="0"></div>
      <div class="tip">TAP A VERSE TO HIGHLIGHT · ← → TURN PAGES · ESC CLOSES</div>
    </div>
  </div>
</div>
<button id="skip" aria-label="Skip intro">SKIP ▶▶</button>
<noscript><div id="noscript">LLAMASTÉ<br>This page needs JavaScript.</div></noscript>
<script>/*INLINE_JS*/</script>
</body>
</html>
