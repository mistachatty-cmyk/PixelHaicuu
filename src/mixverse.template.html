<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mixverse/">
<title>Cuu Jo's Mixverse</title>
<meta name="description" content="Cuu Jo's Mixverse: a floating-CD jukebox of Cuu Jo's tracks, the soundtrack demo for The HaiCuu Experience.">
<style>/*INLINE_CSS*/</style>
</head>
<body>
<div class="aura" id="aura"></div><div class="grain"></div>
<main>
  <header>
    <div class="portrait"><img src="cuu-jo-portrait.jpg" alt="Portrait of Cuu Jo" width="640" height="640"></div>
    <div class="eyebrow">Lok Jukebox &middot; Artist Room</div>
    <h1>Cuu Jo&rsquo;s Mixverse</h1>
    <p class="sub">Special for Cuu Jo, the artist &middot; <span id="count">11 tracks</span></p>
  </header>

  <section class="stage" id="stage" aria-label="Track discs"></section>

  <section class="now" aria-live="polite">
    <div class="t" id="title">&nbsp;</div>
    <div class="m" id="meta">&nbsp;</div>
  </section>

  <section class="panel">
    <canvas class="wave" id="wave" aria-label="Seek bar"></canvas>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button id="shuf" aria-label="Shuffle" aria-pressed="false" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.2 4.1L8.6 15H3v-2h4.6l2.2-2.7L7.6 8H3V6h5.6l2.6 3.3L13.8 6H17V3zm0 10l4 4-4 4v-3h-3.2l-2.5-3.1 1.3-1.6 1.7 2.1H17v-2.4z"/></svg></button>
      <button id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg></button>
      <button id="play" class="play" aria-label="Play"><svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button id="rep" aria-label="Repeat all" aria-pressed="true" title="Repeat all"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      <label class="vol" title="Volume"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05A4.5 4.5 0 0016.5 12z"/></svg><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume"></label>
    </div>
  </section>

  <section class="panel"><ol class="list" id="list"></ol></section>

  <p class="note"><b>Soundtrack demo</b> for The HaiCuu Experience. Track levels are matched on playback; the original recordings are left untouched.</p>
</main>
<footer>Powered by Lok Services &middot; Designed by G6 Designs</footer>

<script>/*INLINE_JS*/</script>
</body>
</html>
